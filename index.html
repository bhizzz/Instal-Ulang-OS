<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instal Ulang OS - Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 500px;
            text-align: center;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #94a3b8;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
        .console {
            background: #020617;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 1rem;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            color: #38bdf8;
            height: 120px;
            overflow-y: auto;
            margin-bottom: 2rem;
        }
        .btn-install {
            background: linear-gradient(to right, #4f46e5, #7c3aed);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.4);
        }
        .btn-install:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.5);
        }
        .btn-install:active {
            transform: translateY(0);
        }
        .progress-bar {
            width: 100%;
            background-color: #334155;
            border-radius: 9999px;
            height: 8px;
            margin-top: 1.5rem;
            display: none;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #22c55e, #10b981);
            border-radius: 9999px;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Instal Ulang OS</h1>
    <p>Script Automated Installer System</p>
    
    <div class="console" id="logConsole">
        [SYSTEM]: Siap melakukan instalasi...<br>
        [SYSTEM]: Menunggu perintah user.
    </div>

    <button class="btn-install" id="installBtn" onclick="startInstallation()">Mulai Instalasi</button>
    
    <div class="progress-bar" id="progressContainer">
        <div class="progress-fill" id="progressBar"></div>
    </div>
</div>

<script>
    function startInstallation() {
        const btn = document.getElementById('installBtn');
        const consoleLog = document.getElementById('logConsole');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        
        btn.style.display = 'none';
        progressContainer.style.display = 'block';
        
        let logs = [
            "[1/4] Mengunduh package system...",
            "[2/4] Ekstrak script Windows konfigurasi...",
            "[3/4] Mengoptimalkan registri OS...",
            "[4/4] Instalasi Selesai! Sistem Anda siap."
        ];
        
        let currentLogIndex = 0;
        let progress = 0;
        
        consoleLog.innerHTML = "[SYSTEM]: Menjalankan skrip otomatis...<br>";
        
        let interval = setInterval(() => {
            progress += 2;
            progressBar.style.width = progress + '%';
            
            if (progress === 25) {
                consoleLog.innerHTML += logs[0] + "<br>";
                consoleLog.scrollTop = consoleLog.scrollHeight;
            } else if (progress === 50) {
                consoleLog.innerHTML += logs[1] + "<br>";
                consoleLog.scrollTop = consoleLog.scrollHeight;
            } else if (progress === 75) {
                consoleLog.innerHTML += logs[2] + "<br>";
                consoleLog.scrollTop = consoleLog.scrollHeight;
            }
            
            if (progress >= 100) {
                clearInterval(interval);
                consoleLog.innerHTML += "<span style='color: #22c55e;'>" + logs[3] + "</span><br>";
                consoleLog.scrollTop = consoleLog.scrollHeight;
            }
        }, 100);
    }
</script>

</body>
</html>
